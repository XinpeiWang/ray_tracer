<?xml version="1.0" encoding="UTF-8"?>
<!-- Cherry Blossom motif: a branch with four blossom clusters, drifting
     petals, leaves, a distant bird and a golden crescent moon - in real
     colour (leaf green, warm gold, a touch of violet) rather than a single
     pink-on-pink tone. Every accent reuses a colour already in this theme's
     own palette (accentSecondary leaf green, logWarning gold, logScene
     violet). Original artwork.

     Placed once (not tiled), anchored top-left, so the branch reads as entering
     the frame from the corner rather than as wallpaper.

     Opacity is baked in; Qt stylesheets have no opacity property for
     background-image. Colour accents (moon/leaves/bird) sit at their own
     higher opacity than the pink blossoms so the palette reads as several
     real colours, not shades of one. -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400">
  <g opacity="0.14">

    <!-- Branch: one main limb from the corner with three offshoots. Drawn as
         filled tapering shapes rather than strokes so it thins toward the tip
         the way a real branch does. -->
    <g fill="#6b5158">
      <path d="M-10 26 q90 20 150 56 q70 42 128 60 q52 16 96 12 q-44 12 -100 -2
               q-62 -18 -132 -60 q-58 -34 -144 -54 Z"/>
      <path d="M118 66 q26 34 34 76 q-16 -38 -44 -70 Z"/>
      <path d="M262 140 q34 20 46 52 q-24 -30 -58 -44 Z"/>
      <path d="M340 190 q30 8 46 34 q-26 -18 -50 -22 Z"/>
    </g>

    <!-- Blossoms: five petals around a small centre, reused at four spots
         and scales so the branch reads as fully in bloom. -->
    <g fill="#c4708c">
      <g transform="translate(152 148)">
        <g>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(72)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(144)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(216)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(288)"/>
        </g>
        <circle r="3.4" fill="#a8546f"/>
      </g>
      <g transform="translate(310 194) scale(0.82)">
        <g>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(72)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(144)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(216)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(288)"/>
        </g>
        <circle r="3.4" fill="#a8546f"/>
      </g>
      <g transform="translate(74 62) scale(0.7)">
        <g>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(72)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(144)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(216)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(288)"/>
        </g>
        <circle r="3.4" fill="#a8546f"/>
      </g>
      <g transform="translate(382 214) scale(0.6)">
        <g>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(72)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(144)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(216)"/>
          <ellipse cx="0" cy="-13" rx="7.5" ry="11" transform="rotate(288)"/>
        </g>
        <circle r="3.4" fill="#a8546f"/>
      </g>
    </g>

    <!-- Loose petals, falling away and to the right, each turned a little
         differently so they don't read as a repeated stamp. -->
    <g fill="#c4708c">
      <ellipse cx="208" cy="232" rx="6" ry="9" transform="rotate(28 208 232)"/>
      <ellipse cx="256" cy="290" rx="5.4" ry="8" transform="rotate(-42 256 290)"/>
      <ellipse cx="352" cy="268" rx="5" ry="7.5" transform="rotate(66 352 268)"/>
      <ellipse cx="404" cy="326" rx="4.6" ry="7" transform="rotate(-16 404 326)"/>
      <ellipse cx="150" cy="300" rx="4.4" ry="6.6" transform="rotate(52 150 300)"/>
      <ellipse cx="300" cy="330" rx="4" ry="6" transform="rotate(-30 300 330)"/>
      <ellipse cx="440" cy="230" rx="3.6" ry="5.4" transform="rotate(18 440 230)"/>
      <ellipse cx="92" cy="230" rx="3.6" ry="5.4" transform="rotate(-58 92 230)"/>
    </g>
  </g>

  <!-- Colour accents: a golden crescent moon, leaf-green foliage among the
       blossoms, and a distant violet bird - own opacity so they read as
       real colour rather than a darker version of the pink. -->
  <g opacity="0.34" stroke="none">
    <!-- Crescent moon, low and to the right, drawn as one circle minus a
         second offset circle so it reads as a thin waxing crescent. -->
    <path d="M420 250 a46 46 0 1 0 0 92 a58 58 0 0 1 0-92 Z" fill="#a4761c"/>

    <!-- Leaves: a pointed-oval pair at three of the four blossom clusters,
         reusing the same taper-to-a-point shape each time. -->
    <g fill="#5f8a6a">
      <path d="M152 148 q-18-4 -26-20 q18 0 26 20 Z"/>
      <path d="M152 148 q4-20 20-28 q4 20 -20 28 Z"/>
      <path d="M310 194 q-16-2 -24-16 q16-2 24 16 Z"/>
      <path d="M74 62 q-14-4 -20-16 q14-2 20 16 Z"/>
    </g>

    <!-- A distant bird, a simple two-stroke silhouette, high in the open
         sky above the branch. -->
    <path d="M262 34 q10-10 22-4 q-8 0 -12 6 q12-2 20 6 q-14-2 -20 2 q-6-4 -10-10 Z" fill="#8a5f9e"/>
  </g>
</svg>
