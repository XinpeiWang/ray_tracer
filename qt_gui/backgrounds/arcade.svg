<?xml version="1.0" encoding="UTF-8"?>
<!-- Retro Arcade motif: a starfield with a pixel-art invader sprite, a
     power-up gem, and a coin, in real multi-colour palette pulled from this
     theme's own accents (green invader, pink/gold gem+coin, violet star) -
     not a single ink tone. The look of an eighties cabinet attract screen.
     Original artwork - a generic 8-bit alien silhouette, not any specific
     game's character.

     TILES - same seam rule as blueprint.svg: anything on an edge is drawn on
     the top/left only, never bottom/right, so neighbouring tiles don't
     double up along the seam. The sprite/gem/coin/stars all sit safely
     inside the tile with margin, so only the scanline needs that care.

     Opacity is baked in; Qt stylesheets have no opacity property for
     background-image. Colour elements sit at a higher opacity than the
     starfield so they read as colour, not just darker dots. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <g opacity="0.16">
    <!-- Starfield on a 24px pitch, offset every other row, sizes varied so
         it reads as a field of stars rather than graph paper. -->
    <g fill="#3d3550">
      <rect x="4"  y="4"  width="2" height="2"/>
      <rect x="52" y="4"  width="2" height="2"/>
      <rect x="4"  y="52" width="2" height="2"/>
      <rect x="28" y="52" width="2" height="2"/>
      <rect x="88" y="16" width="2" height="2"/>
      <rect x="90" y="70" width="2" height="2"/>
      <rect x="12" y="86" width="2" height="2"/>
    </g>
    <!-- A couple of "bright" stars in a cool colour for twinkle contrast
         against the dark base stars. -->
    <g fill="#5a5fa8">
      <rect x="27" y="3"  width="4" height="4"/>
      <rect x="51" y="51" width="4" height="4"/>
    </g>
  </g>

  <g opacity="0.45">
    <!-- Pixel-art invader, an 8x6-block generic alien silhouette in the
         theme's own success green, well clear of every edge. Blocks are 2px
         so the whole sprite is 16x12. -->
    <g fill="#3f8f5c">
      <rect x="52" y="10" width="2" height="2"/><rect x="62" y="10" width="2" height="2"/>
      <rect x="54" y="12" width="2" height="2"/><rect x="60" y="12" width="2" height="2"/>
      <rect x="52" y="14" width="12" height="2"/>
      <rect x="50" y="16" width="4" height="2"/><rect x="56" y="16" width="4" height="2"/><rect x="62" y="16" width="4" height="2"/>
      <rect x="50" y="18" width="16" height="2"/>
      <rect x="50" y="20" width="2" height="2"/><rect x="60" y="20" width="2" height="2"/>
      <rect x="64" y="20" width="2" height="2"/>
    </g>
    <!-- Red eye-blocks, the one spot of contrast colour on the sprite. -->
    <g fill="#c2465f">
      <rect x="54" y="20" width="2" height="2"/>
    </g>

    <!-- Power-up gem: a faceted diamond with a highlight, the theme's own
         primary accent pink, plus a paler facet for shine. -->
    <g transform="translate(20 62)" fill="#c2465f">
      <path d="M0 -10 L8 0 L0 10 L-8 0 Z"/>
      <path d="M0 -10 L4 0 L0 10 L-4 0 Z" fill="#e8a3b3"/>
    </g>

    <!-- A gold coin, the classic arcade pickup, blocky to match the sprite
         style. -->
    <g fill="#c17a10">
      <rect x="34" y="56" width="6" height="2"/>
      <rect x="32" y="58" width="2" height="4"/><rect x="40" y="58" width="2" height="4"/>
      <rect x="34" y="62" width="6" height="2"/>
      <rect x="35" y="59" width="4" height="2" fill="#e0aa3f"/>
    </g>
  </g>

  <g opacity="0.16">
    <!-- One scanline per tile, top edge only. -->
    <rect x="0" y="0" width="96" height="1" fill="#3d3550"/>
  </g>
</svg>
