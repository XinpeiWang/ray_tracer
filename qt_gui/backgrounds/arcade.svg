<?xml version="1.0" encoding="UTF-8"?>
<!-- Retro Arcade motif: a starfield with a pixel-art invader sprite and a
     power-up gem, the look of an eighties cabinet attract screen. Original
     artwork - a generic 8-bit alien silhouette, not any specific game's
     character.

     TILES - same seam rule as blueprint.svg: anything on an edge is drawn on
     the top/left only, never bottom/right, so neighbouring tiles don't
     double up along the seam. The sprite/gem/stars all sit safely inside
     the tile with margin, so only the scanline needs that care.

     Opacity is baked in; Qt stylesheets have no opacity property for
     background-image. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <g opacity="0.16">
    <!-- Starfield on a 24px pitch, offset every other row, sizes varied so
         it reads as a field of stars rather than graph paper. -->
    <g fill="#3d3550">
      <rect x="4"  y="4"  width="2" height="2"/>
      <rect x="27" y="3"  width="4" height="4"/>
      <rect x="52" y="4"  width="2" height="2"/>
      <rect x="4"  y="52" width="2" height="2"/>
      <rect x="28" y="52" width="2" height="2"/>
      <rect x="51" y="51" width="4" height="4"/>
      <rect x="88" y="16" width="2" height="2"/>
      <rect x="90" y="70" width="2" height="2"/>
      <rect x="12" y="86" width="2" height="2"/>
    </g>

    <!-- Pixel-art invader, an 8x6-block generic alien silhouette, well
         clear of every edge. Blocks are 2px so the whole sprite is 16x12. -->
    <g fill="#2f8f8f">
      <rect x="52" y="10" width="2" height="2"/><rect x="62" y="10" width="2" height="2"/>
      <rect x="54" y="12" width="2" height="2"/><rect x="60" y="12" width="2" height="2"/>
      <rect x="52" y="14" width="12" height="2"/>
      <rect x="50" y="16" width="4" height="2"/><rect x="56" y="16" width="4" height="2"/><rect x="62" y="16" width="4" height="2"/>
      <rect x="50" y="18" width="16" height="2"/>
      <rect x="50" y="20" width="2" height="2"/><rect x="54" y="20" width="2" height="2"/>
      <rect x="60" y="20" width="2" height="2"/><rect x="64" y="20" width="2" height="2"/>
    </g>

    <!-- Power-up gem: a faceted diamond with a highlight, the "extra life"
         glint reimagined as a collectible. -->
    <g transform="translate(20 62)" fill="#d94f70">
      <path d="M0 -10 L8 0 L0 10 L-8 0 Z"/>
      <path d="M0 -10 L4 0 L0 10 L-4 0 Z" fill="#f0a8bb"/>
    </g>

    <!-- A trailing spark, a small motion glint near the gem. -->
    <g fill="#d94f70">
      <rect x="34" y="58" width="2" height="2"/>
      <rect x="39" y="64" width="2" height="2"/>
    </g>

    <!-- One scanline per tile, top edge only. -->
    <rect x="0" y="0" width="96" height="1" fill="#3d3550"/>
  </g>
</svg>
