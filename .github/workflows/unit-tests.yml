name: Unit tests

# Builds and runs the portable, SDK-independent test target (tests/unit_tests,
# see tests/CMakeLists.txt) on every push/PR. This project's full test suite
# (tests/ray_tracer_tests.vcxproj) also covers the CUDA/OptiX-dependent GPU
# code, but that needs a real NVIDIA GPU plus the CUDA Toolkit + OptiX SDK
# installed, none of which a standard GitHub-hosted runner has - see
# tests/CMakeLists.txt's own comments on exactly which files are excluded
# from this portable target and why. This is deliberately scoped to what
# CAN run here: the CPU-only unit tests are still real, substantial
# coverage (BVH, materials, cameras, sampling, BDPT, SPPM, volumetrics,
# pbrt scene loading), and having zero automated testing at all was
# strictly worse than having this subset.
#
# The metal-poc job below closes the equivalent gap for gpu/metal/ (see
# docs/METAL_GPU_FEASIBILITY.md) - every one of that series' PRs was
# "verified" by hand-running a full clean rebuild + ctest locally, with
# nothing checking automatically that a later change didn't silently
# break it. Unlike the CUDA/OptiX renderer, this backend's build itself
# needs no special SDK beyond Xcode's own Metal/Foundation frameworks
# (already present on every macOS runner image), so a real macOS runner
# CAN compile and link it - that half of the gap is closed unconditionally.
# Whether it can also RUN the raytracing-dependent tests depends on
# whether the runner's own (paravirtualized, on a hosted VM) GPU passes
# this project's own supportsRaytracing check in parseArgsAndCreateDevice()
# (gpu/metal/metal_poc.mm) - genuinely unverified as of this workflow's
# own introduction, since GitHub's hosted macOS runners historically
# returned no usable Metal device at all and only recently started
# exposing a paravirtual one, with unconfirmed feature-family support.
# The "Run device-dependent tests" step below treats exactly that failure
# mode (both of parseArgsAndCreateDevice()'s own two possible stderr
# messages) as a clearly-labelled non-fatal skip rather than a red build,
# so this workflow degrades gracefully either way: if the runner's GPU
# does support it, these tests run for real with zero further changes
# needed; if it doesn't, CI stays green with an honest annotation instead
# of either a permanently-red check nobody can fix or silently disabling
# the check and losing its value. Any OTHER failure (a real crash, a
# real regression) still fails the job outright.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        working-directory: tests
        # No explicit -G here on purpose: CMake auto-selects the newest
        # installed Visual Studio generator on Windows when none is given.
        # This job used to hardcode -G "Visual Studio 17 2022", which
        # broke outright (not flaky - every single run failed with "could
        # not find any instance of Visual Studio") once GitHub's own
        # windows-latest image moved to windows-2025-vs2026 (Visual Studio
        # 2026, whose own CMake generator is a DIFFERENT string, "Visual
        # Studio 18 2026", added in CMake 4.2) - VS 2022 itself is no
        # longer installed on that image at all. Every run in this
        # project's own history was silently treating that hard failure
        # as "expected pre-existing noise" instead of a real, fixable bug.
        # Letting CMake auto-detect avoids hardcoding a version string
        # that will go stale again the next time GitHub bumps the image.
        run: cmake -B build -A x64

      - name: Build (Release)
        working-directory: tests
        run: cmake --build build --config Release

      - name: Run unit_tests
        # Deliberately NOT working-directory: tests, unlike the two steps
        # above - several tests (e.g. PbrtCpuBuildTest.NanoVdbTemperature
        # NameProducesRealEmission) load fixture files under pbrt_scenes/
        # by a path relative to the test binary's own cwd, which the
        # tests themselves document as "the repo root" (see that test's
        # own comment in tests/unit/pbrt_cpu_builder_tests.cpp). Running
        # from tests/ instead silently pointed that relative path at a
        # pbrt_scenes/ that doesn't exist there, and the nanovdb loader's
        # own generic "corrupt file, wrong gridname, or unsupported grid
        # type" error message doesn't distinguish that from a real
        # corrupt-data problem - reproduced locally on macOS by running
        # the exact same binary from tests/ instead of the repo root, so
        # this was never actually a Windows-specific issue.
        run: .\tests\build\Release\unit_tests.exe --gtest_color=yes

      - name: Run CPU integrator agreement tests
        # The CPU path tracer, BDPT, MLT, SPPM and the debug integrators rendered on small pbrt scenes and compared with each other and with closed forms
        # (tests/unit/cpu_integrator_agreement_tests.cpp; every defect they pin read 1-25% off before it was fixed). Built by the "Build (Release)" step
        # above (the default target builds everything). From the repo root, like unit_tests, so pbrt_scenes/ resolves. They render, so allow a few
        # minutes on a hosted runner.
        timeout-minutes: 20
        run: .\tests\build\Release\cpu_integrator_tests.exe --gtest_color=yes

  unit-tests-macos:
    # The same portable test target as the Windows job above, on Apple silicon: it builds and passes there (about 3,570 tests, ~20 s to run
    # natively) and so catches a macOS-only break - a header that only compiles with MSVC, a path assumption, an Apple clang diagnostic - that the
    # Windows job cannot. Same two executables, same cwd rule (the repo root, so pbrt_scenes/ resolves). Pinned to macos-14 like metal-poc.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: unit-tests-macos-14
          max-size: 500M

      - name: Ensure Ninja
        run: command -v ninja || brew install ninja

      - name: Configure (CMake)
        run: >
          cmake -S tests -B build_tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (Release)
        run: cmake --build build_tests --target unit_tests cpu_integrator_tests

      - name: Run unit_tests
        # From the repo root, not tests/ - see the Windows job's own comment on why (fixtures under pbrt_scenes/ are found relative to the cwd).
        # TEMP: several tests build scratch folders under $TEMP (set on Windows, not on macOS); without it they would litter the repo root. The `runner`
        # context is not available at job level, so it is set on the steps that run tests.
        env:
          TEMP: ${{ runner.temp }}
        run: build_tests/unit_tests --gtest_color=yes

      - name: Run CPU integrator agreement tests
        timeout-minutes: 20
        env:
          TEMP: ${{ runner.temp }}
        run: build_tests/cpu_integrator_tests --gtest_color=yes

  metal-poc:
    # Pinned to a specific image, not macos-latest - this job's own
    # sibling above already learned this lesson the hard way once
    # (windows-latest silently moving to a VS version whose CMake
    # generator string changed, see its own "Configure (CMake)" step
    # comment); macos-14 is Apple silicon (M1-class), matching
    # docs/METAL_GPU_FEASIBILITY.md's own target platform.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Compiler cache: the Metal build is ~2 min from scratch every run; with a warm cache a typical PR only
      # recompiles what it touched. ccache is keyed by the compiler + preprocessed source, so a stale entry
      # cannot produce a wrong object. Ninja (preinstalled on the runner image) for the faster scheduler.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: metal-poc-macos-14
          max-size: 500M

      - name: Ensure Ninja
        run: command -v ninja || brew install ninja

      - name: Configure (CMake, RT_BUILD_METAL=ON)
        run: >
          cmake -B build -G Ninja -DRT_BUILD_METAL=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache

      - name: Build (Release)
        # Builds cpu_renderer, metal_renderer (every gpu/metal/*.mm +
        # *.metal string this project's runtime shader loader
        # concatenates), the standalone metal_poc/metal_poc_validate/
        # metal_poc_math_tests/metal_poc_shader_tests executables, AND
        # ray_tracer itself with RT_HAVE_METAL (the real launcher --gpu
        # dispatch path, gpu/metal/metal_interface.h) - a compile break
        # anywhere in ~24,000 lines of Metal-backend code fails this
        # step unconditionally, independent of the device-availability
        # question the later steps deal with.
        run: cmake --build build --config Release

      - name: Run host-only math tests
        # metal_poc_math_tests needs no Metal device at all (plain,
        # GPU-independent host C++ checked against known-correct
        # reference values - see gpu/metal/metal_poc_math_tests.cpp's
        # own comment) - always safe to run unconditionally, unlike the
        # device-dependent step below.
        working-directory: build
        run: ctest --output-on-failure -R '^metal_poc_math_tests$'

      - name: Run device-dependent tests (shader tests + smoke render/validate)
        working-directory: build
        # See this workflow's own top-of-file comment for the full
        # rationale: treat "no usable/no-raytracing-capable Metal
        # device on this runner" as a distinct, non-fatal, clearly
        # annotated outcome (both exact stderr strings
        # parseArgsAndCreateDevice()/metal_poc_shader_tests.mm's own
        # device check can print), not a red build - any OTHER ctest
        # failure still fails this step for real.
        #
        # metal_poc_isolate_pbrt_lighting_smoke/_validate are the only tests
        # that run the real `ray_tracer --gpu` executable (launcher/main.cpp's
        # RT_HAVE_METAL dispatch -> metal_render_main()) rather than the
        # standalone metal_poc/metal_poc_validate binaries - without them in
        # this filter a regression in that CLI path builds green and passes.
        # They reach the same device check, so the same "no raytracing
        # device" skip handling below applies to them.
        run: |
          set +e
          ctest --output-on-failure -R '^metal_poc_(shader_tests|smoke_render|smoke_validate|isolate_pbrt_lighting_smoke|isolate_pbrt_lighting_validate|write_failure_exit_code|seed_reproducible|crop_window|cpu_gpu_parity)$'
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            if grep -rqi "does not support hardware raytracing\|No Metal device available" Testing/Temporary/LastTest.log 2>/dev/null; then
              echo "::warning::This runner's Metal device doesn't support hardware raytracing (or none was exposed) - device-dependent Metal tests skipped, not a code regression. See this workflow's own top-of-file comment and docs/METAL_GPU_FEASIBILITY.md."
              exit 0
            fi
            exit $rc
          fi

  qt-gui:
    # The Qt GUI was compiled in no CI job at all: a break there (a Qt API a newer or older Qt changed, a source file added to one platform's
    # build list but not the other) showed up only when somebody built it by hand. This builds the real GUI project with the Qt version the
    # project pins (6.11.1, see qt_gui/QT6_INSTALLATION_GUIDE.md) on both desktop platforms, and runs the QtTest for the two "Download missing
    # files" back ends (qt_gui/tests/downloader_tests.cpp), which serve their own files from a local socket and need no network.
    # It does not run the GUI (no GPU, no renderer libraries on a runner); scripts/gui_selftest.py does that on a developer machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            qt_arch: ""
          - os: windows-latest
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia'
          cache: true

      - name: Set up the MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and run the downloader tests (macOS)
        if: runner.os == 'macOS'
        working-directory: qt_gui/tests
        run: |
          qmake downloader_tests.pro CONFIG+=release
          make -j4
          make check

      - name: Build and run the downloader tests (Windows)
        if: runner.os == 'Windows'
        working-directory: qt_gui/tests
        shell: cmd
        run: |
          qmake downloader_tests.pro CONFIG-=debug_and_release CONFIG+=release || exit /b 1
          nmake || exit /b 1
          nmake check || exit /b 1

      - name: Build the GUI (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build_gui && cd build_gui
          qmake ../qt_gui/RayTracerGUI.pro CONFIG+=release
          make -j4

      - name: Build the GUI (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir build_gui && cd build_gui
          qmake ..\qt_gui\RayTracerGUI.pro CONFIG-=debug_and_release CONFIG+=release || exit /b 1
          nmake || exit /b 1

  build-lists:
    # The test suite is built by two hand-maintained lists (the MSBuild solution's tests/ray_tracer_tests.vcxproj and the portable
    # tests/CMakeLists.txt). A test file added to only one is silently never built by the other platform; three had gone missing from the
    # MSBuild list this way. See scripts/check_build_lists.py. Pure Python, instant.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the test build lists agree
        run: python3 scripts/check_build_lists.py
