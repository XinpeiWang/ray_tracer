name: Unit tests

# Builds and runs the portable, SDK-independent test target (tests/unit_tests,
# see tests/CMakeLists.txt) on every push/PR. This project's full test suite
# (tests/ray_tracer_tests.vcxproj) also covers the CUDA/OptiX-dependent GPU
# code, but that needs a real NVIDIA GPU plus the CUDA Toolkit + OptiX SDK
# installed, none of which a standard GitHub-hosted runner has - see
# tests/CMakeLists.txt's own comments on exactly which files are excluded
# from this portable target and why. Until a self-hosted GPU runner is
# available, this is deliberately scoped to what CAN run here: the CPU-only
# unit tests are still real, substantial coverage (BVH, materials, cameras,
# sampling, BDPT, SPPM, volumetrics, pbrt scene loading), and having zero
# automated testing at all was strictly worse than having this subset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake)
        working-directory: tests
        # No explicit -G here on purpose: CMake auto-selects the newest
        # installed Visual Studio generator on Windows when none is given.
        # This job used to hardcode -G "Visual Studio 17 2022", which
        # broke outright (not flaky - every single run failed with "could
        # not find any instance of Visual Studio") once GitHub's own
        # windows-latest image moved to windows-2025-vs2026 (Visual Studio
        # 2026, whose own CMake generator is a DIFFERENT string, "Visual
        # Studio 18 2026", added in CMake 4.2) - VS 2022 itself is no
        # longer installed on that image at all. Every run in this
        # project's own history was silently treating that hard failure
        # as "expected pre-existing noise" instead of a real, fixable bug.
        # Letting CMake auto-detect avoids hardcoding a version string
        # that will go stale again the next time GitHub bumps the image.
        run: cmake -B build -A x64

      - name: Build (Release)
        working-directory: tests
        run: cmake --build build --config Release

      - name: Run unit_tests
        # Deliberately NOT working-directory: tests, unlike the two steps
        # above - several tests (e.g. PbrtCpuBuildTest.NanoVdbTemperature
        # NameProducesRealEmission) load fixture files under pbrt_scenes/
        # by a path relative to the test binary's own cwd, which the
        # tests themselves document as "the repo root" (see that test's
        # own comment in tests/unit/pbrt_cpu_builder_tests.cpp). Running
        # from tests/ instead silently pointed that relative path at a
        # pbrt_scenes/ that doesn't exist there, and the nanovdb loader's
        # own generic "corrupt file, wrong gridname, or unsupported grid
        # type" error message doesn't distinguish that from a real
        # corrupt-data problem - reproduced locally on macOS by running
        # the exact same binary from tests/ instead of the repo root, so
        # this was never actually a Windows-specific issue.
        run: .\tests\build\Release\unit_tests.exe --gtest_color=yes
